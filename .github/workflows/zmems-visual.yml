name: Z_Mems vanilla visual review
on:
  push:
    branches: ['research/zmems-visual']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f z_mems/pom.xml package -DskipTests
      - run: python3 -m pip install pillow python-xlib nbtlib
      - name: Capture real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/zmems_visual_probe.py
      - name: Record evidence
        if: always()
        run: |
          mkdir -p z_mems/visual-qa
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f z_mems/visual-qa/
          git diff --cached --quiet && exit 0
          git commit -m 'Record Z_Mems client screenshots [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
