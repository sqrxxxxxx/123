name: Z_Mems Paper verification
on:
  push:
    branches: ['feature/z-mems']
    paths: ['z_mems/**','tools/build_zmems_pack.py','tools/zmems_*','.github/workflows/zmems-paper.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zmems-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and unit tests
        run: |
          set -o pipefail
          mkdir -p z_mems/qa
          mvn -B -f z_mems/pom.xml verify 2>&1 | tee z_mems/qa/build.log
      - name: Verify resources
        run: |
          set -o pipefail
          python3 -m pip install pillow
          python3 tools/build_zmems_pack.py 2>&1 | tee z_mems/qa/pack-build.log
      - name: Disposable Paper gameplay and restart
        run: |
          set -o pipefail
          python3 tools/zmems_native_smoke.py 2>&1 | tee z_mems/qa/native-run.log
      - name: Prepare plugin
        if: success()
        run: cp z_mems/target/Z_Mems-1.0.0.jar dist/Z_Mems-1.0.0.jar
      - name: Preserve evidence
        if: always()
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f z_mems/qa/
          if [ -f dist/Z_Mems-1.0.0.jar ]; then git add dist/Z_Mems-1.0.0.jar; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record Z_Mems verification [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
